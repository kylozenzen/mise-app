[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 1. EXPLICIT PASS-THROUGH FOR NETLIFY FUNCTIONS (Must come first!)
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. Catch-all routing for your SPA views and deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
